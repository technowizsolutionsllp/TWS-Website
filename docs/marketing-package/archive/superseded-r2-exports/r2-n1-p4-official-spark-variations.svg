    <text class="label" x="26" y="42">P4-B / Spark W Compression</text>
    <g transform="translate(46 65)">
      <rect width="120" height="120" rx="26" class="ink"/>
      <path d="M38 33H75L91 49V96H38V33Z" fill="#FFFFFF"/>
      <path d="M75 33V48H91" fill="#D9E1EA"/>
      <path d="M49 61H76M49 76H64" stroke="#2356D9" stroke-width="8" stroke-linecap="round"/>
      <path d="M34 100C46 84 56 84 61 100C68 84 78 84 90 100" stroke="#7DD3C7" stroke-width="8" stroke-linecap="round"/>
      <circle cx="60" cy="23" r="6" class="gold"/>
      <path d="M60 7V15M47 29L39 21M73 29L81 21" class="gold-spark"/>
    </g>
    <text class="title" x="198" y="118">PDF Compressor</text>
    <text class="note" x="200" y="152">W motif reads as compression curve.</text>
  </g>

  <g transform="translate(1086 865)">
    <rect class="panel" width="450" height="250" rx="18"/>
    <text class="label" x="26" y="42">P4-C / Shrink Spark</text>
    <g transform="translate(46 65)">
      <rect width="120" height="120" rx="26" fill="#EFF6FF"/>
      <path d="M39 33H74L90 49V96H39V33Z" class="ink"/>
      <path d="M74 33V49H90" class="blue"/>
      <path d="M27 66H41M89 66H103" stroke="#C77A15" stroke-width="7" stroke-linecap="round"/>
      <path d="M38 56L27 66L38 76M92 56L103 66L92 76" stroke="#C77A15" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M39 102C50 89 79 89 91 102" class="teal-line"/>
      <circle cx="60" cy="23" r="6" class="gold"/>
      <path d="M60 7V15M47 29L39 21M73 29L81 21" class="gold-spark"/>
    </g>
    <text class="title" x="198" y="118">PDF Compressor</text>
    <text class="note" x="200" y="152">Best compression read from this set.</text>
  </g>

  <g transform="translate(64 1165)">
    <rect class="panel" width="450" height="250" rx="18"/>
    <text class="label" x="26" y="42">P4-D / Preview Spark</text>
    <g transform="translate(46 65)">
      <rect width="120" height="120" rx="26" class="ink"/>
      <path d="M37 32H76L92 48V97H37V32Z" fill="#FFFFFF"/>
      <path d="M76 32V48H92" fill="#D9E1EA"/>
      <path d="M62 42V87" stroke="#D9E1EA" stroke-width="5"/>
      <path d="M46 60H56M69 60H82M46 75H55M69 75H78" stroke="#2356D9" stroke-width="6" stroke-linecap="round"/>
      <path d="M42 100C54 89 76 89 88 100" stroke="#7DD3C7" stroke-width="8" stroke-linecap="round"/>
      <circle cx="60" cy="23" r="6" class="gold"/>
      <path d="M60 7V15M47 29L39 21M73 29L81 21" class="gold-spark"/>
    </g>
    <text class="title" x="198" y="118">PDF Compressor</text>
    <text class="note" x="200" y="152">Best for preview-before-save positioning.</text>
  </g>

  <g transform="translate(575 1165)">
    <rect class="panel" width="450" height="250" rx="18"/>
    <text class="label" x="26" y="42">P4-E / Minimal Official</text>
    <g transform="translate(46 65)">
      <rect width="120" height="120" rx="26" fill="#fff" stroke="#d9e1ea"/>
      <path d="M39 34H73L89 50V96H39V34Z" class="ink"/>
      <path d="M73 34V50H89" class="teal"/>
      <path d="M51 64H75M51 80H65" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
      <path d="M42 103C53 92 75 92 86 103" class="teal-line"/>
      <circle cx="60" cy="23" r="6" class="gold"/>
      <path d="M60 7V15M47 29L39 21M73 29L81 21" class="gold-spark"/>
    </g>
    <text class="title" x="198" y="118">PDF Compressor</text>
    <text class="note" x="200" y="152">Simplest and most scalable P4 variant.</text>
  </g>
</svg>
