<svg width="1600" height="1800" viewBox="0 0 1600 1800" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Technowiz technology wizardry Sanskrit-inspired logo variants</title>
  <desc id="desc">Ten refined logo directions combining technology, wizardry, and Sanskrit-inspired visual structure.</desc>
  <rect width="1600" height="1800" fill="#F8FAFC"/>

  <defs>
