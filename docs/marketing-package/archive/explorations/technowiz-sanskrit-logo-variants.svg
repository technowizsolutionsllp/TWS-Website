<svg width="1600" height="1800" viewBox="0 0 1600 1800" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Technowiz Solutions Sanskrit-inspired logo variants</title>
  <desc id="desc">Ten prototype logo directions inspired by Sanskrit and Devanagari visual language.</desc>
  <rect width="1600" height="1800" fill="#F8FAFC"/>

  <defs>
    <style>
      .panel { fill: #ffffff; stroke: #d9e1ea; }
      .label { fill: #667085; font: 700 18px Arial, Helvetica, sans-serif; letter-spacing: 0; }
      .name { fill: #102033; font: 760 39px Arial, Helvetica, sans-serif; letter-spacing: 0; }
      .sub { fill: #667085; font: 620 20px Arial, Helvetica, sans-serif; letter-spacing: 0; }
      .note { fill: #667085; font: 500 16px Arial, Helvetica, sans-serif; letter-spacing: 0; }
      .ink { fill: #102033; }
      .blue { fill: #2356d9; }
      .teal { fill: #008f7a; }
      .saffron { fill: #c77a15; }
      .line { stroke: #102033; stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; }
      .line-thin { stroke: #102033; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .line-teal { stroke: #008f7a; stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; }
      .line-blue { stroke: #2356d9; stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; }
      .line-saffron { stroke: #c77a15; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <text x="64" y="72" fill="#102033" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="760">Technowiz Solutions logo exploration</text>
  <text x="64" y="112" fill="#667085" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="520">Sanskrit-inspired directions using shirorekha, bindu, akshara, sutra, mandala, and manuscript cues without sacred-symbol appropriation.</text>

  <g transform="translate(64 160)">
    <rect class="panel" width="700" height="280" rx="18"/>
    <text class="label" x="28" y="42">01 / Shirorekha T</text>
    <g transform="translate(46 82)">
      <rect width="118" height="118" rx="24" class="ink"/>
      <path d="M27 34H91" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
      <path d="M58 34V87" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round"/>
      <path d="M35 85C45 65 51 65 59 85C67 65 74 65 84 85" stroke="#7DD3C7" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="91" cy="34" r="6" fill="#C77A15"/>
    </g>
    <text class="name" x="196" y="139">Technowiz</text>
    <text class="sub" x="198" y="172">Solutions</text>
    <text class="note" x="198" y="213">Devanagari headline cue, still readable as a tech mark.</text>
  </g>

  <g transform="translate(836 160)">
    <rect class="panel" width="700" height="280" rx="18"/>
    <text class="label" x="28" y="42">02 / Bindu Circuit</text>
    <g transform="translate(46 82)">
      <rect width="118" height="118" rx="24" fill="#F0FBF8"/>
      <circle cx="59" cy="59" r="30" fill="#102033"/>
      <circle cx="59" cy="59" r="9" fill="#7DD3C7"/>
      <path d="M59 29V17M59 89V101M29 59H17M89 59H101" class="line-saffron"/>
      <circle cx="59" cy="17" r="5" class="blue"/>
      <circle cx="101" cy="59" r="5" class="blue"/>
      <circle cx="59" cy="101" r="5" class="blue"/>
      <circle cx="17" cy="59" r="5" class="blue"/>
    </g>
    <text class="name" x="196" y="139">Technowiz</text>
    <text class="sub" x="198" y="172">Solutions</text>
    <text class="note" x="198" y="213">Bindu as focus point, connected to software systems.</text>
  </g>

  <g transform="translate(64 472)">
    <rect class="panel" width="700" height="280" rx="18"/>
    <text class="label" x="28" y="42">03 / Akshara Window</text>
    <g transform="translate(46 82)">
      <rect width="118" height="118" rx="24" fill="#FFFFFF" stroke="#D9E1EA"/>
      <path d="M30 35H88" class="line"/>
      <path d="M36 35V84H80" class="line"/>
      <path d="M52 56H84" class="line-teal"/>
      <path d="M84 56C96 56 96 78 82 84" stroke="#2356D9" stroke-width="9" stroke-linecap="round"/>
    </g>
    <text class="name" x="196" y="139">Technowiz</text>
    <text class="sub" x="198" y="172">Solutions</text>
    <text class="note" x="198" y="213">Letterform-inspired structure with product-window geometry.</text>
  </g>

  <g transform="translate(836 472)">
    <rect class="panel" width="700" height="280" rx="18"/>
    <text class="label" x="28" y="42">04 / Sutra Path</text>
    <g transform="translate(46 82)">
      <rect width="118" height="118" rx="24" class="ink"/>
      <path d="M25 36H93" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>
      <path d="M32 78C44 52 58 52 70 78C78 94 89 94 96 78" stroke="#7DD3C7" stroke-width="10" stroke-linecap="round"/>
      <path d="M42 36V76M75 36V76" stroke="#2356D9" stroke-width="8" stroke-linecap="round"/>
      <circle cx="32" cy="78" r="6" fill="#C77A15"/>
      <circle cx="96" cy="78" r="6" fill="#C77A15"/>
    </g>
    <text class="name" x="196" y="139">Technowiz</text>
    <text class="sub" x="198" y="172">Solutions</text>
    <text class="note" x="198" y="213">Sutra as thread/path: guidance from input to decision.</text>
  </g>

  <g transform="translate(64 784)">
    <rect class="panel" width="700" height="280" rx="18"/>
    <text class="label" x="28" y="42">05 / Mandala Grid</text>
    <g transform="translate(46 82)">
      <rect width="118" height="118" rx="24" fill="#F8FAFC" stroke="#D9E1EA"/>
      <circle cx="59" cy="59" r="34" fill="#102033"/>
      <path d="M59 25V93M25 59H93M35 35L83 83M83 35L35 83" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
      <circle cx="59" cy="59" r="13" fill="#008F7A"/>
      <circle cx="59" cy="25" r="5" fill="#2356D9"/>
      <circle cx="93" cy="59" r="5" fill="#2356D9"/>
      <circle cx="59" cy="93" r="5" fill="#2356D9"/>
      <circle cx="25" cy="59" r="5" fill="#2356D9"/>
    </g>
    <text class="name" x="196" y="139">Technowiz</text>
    <text class="sub" x="198" y="172">Solutions</text>
    <text class="note" x="198" y="213">Symmetry and precision; strongest enterprise symbol.</text>
  </g>

  <g transform="translate(836 784)">
    <rect class="panel" width="700" height="280" rx="18"/>
    <text class="label" x="28" y="42">06 / Grantha Leaf</text>
    <g transform="translate(46 82)">
      <rect width="118" height="118" rx="24" fill="#102033"/>
      <path d="M30 41C49 28 75 28 88 45C72 44 56 50 44 64C38 58 34 50 30 41Z" fill="#7DD3C7"/>
      <path d="M28 82C49 95 75 94 90 74C72 76 56 70 44 56C38 63 32 72 28 82Z" fill="#FFFFFF"/>
      <path d="M43 62H91" stroke="#2356D9" stroke-width="8" stroke-linecap="round"/>
      <circle cx="91" cy="62" r="6" fill="#C77A15"/>
    </g>
    <text class="name" x="196" y="139">Technowiz</text>
    <text class="sub" x="198" y="172">Solutions</text>
    <text class="note" x="198" y="213">Manuscript/knowledge cue with a modern data axis.</text>
  </g>

  <g transform="translate(64 1096)">
    <rect class="panel" width="700" height="280" rx="18"/>
    <text class="label" x="28" y="42">07 / Yantra Frame</text>
    <g transform="translate(46 82)">
      <rect width="118" height="118" rx="24" fill="#FFFFFF" stroke="#D9E1EA"/>
      <path d="M59 23L91 87H27L59 23Z" fill="#102033"/>
      <path d="M59 95L29 37H89L59 95Z" fill="#2356D9" opacity="0.88"/>
      <circle cx="59" cy="59" r="15" fill="#7DD3C7"/>
      <path d="M31 31H87V87H31V31Z" stroke="#102033" stroke-width="5"/>
    </g>
    <text class="name" x="196" y="139">Technowiz</text>
    <text class="sub" x="198" y="172">Solutions</text>
    <text class="note" x="198" y="213">Geometric discipline; use carefully, more symbolic.</text>
  </g>

  <g transform="translate(836 1096)">
    <rect class="panel" width="700" height="280" rx="18"/>
    <text class="label" x="28" y="42">08 / Matra Wordmark</text>
    <g transform="translate(46 82)">
      <rect width="118" height="118" rx="24" class="ink"/>
      <path d="M26 35H92" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round"/>
      <path d="M35 48V88M58 48V88M82 48V88" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round"/>
      <path d="M35 88C48 73 69 73 82 88" stroke="#7DD3C7" stroke-width="9" stroke-linecap="round"/>
    </g>
    <text class="name" x="196" y="139">TechnoWiz</text>
    <text class="sub" x="198" y="172">Solutions</text>
    <text class="note" x="198" y="213">Headline-led wordmark system, simple and ownable.</text>
  </g>

  <g transform="translate(64 1408)">
    <rect class="panel" width="700" height="280" rx="18"/>
    <text class="label" x="28" y="42">09 / Tarka Signal</text>
    <g transform="translate(46 82)">
      <rect width="118" height="118" rx="24" fill="#F0FBF8"/>
      <path d="M30 36H89" class="line"/>
      <path d="M59 36V92" class="line"/>
      <path d="M33 76H82" class="line-blue"/>
      <path d="M82 76L70 64M82 76L70 88" class="line-blue"/>
      <circle cx="94" cy="36" r="7" class="saffron"/>
    </g>
    <text class="name" x="196" y="139">Technowiz</text>
    <text class="sub" x="198" y="172">Solutions</text>
    <text class="note" x="198" y="213">Tarka means reasoning; a rational decision-workflow cue.</text>
  </g>

  <g transform="translate(836 1408)">
    <rect class="panel" width="700" height="280" rx="18"/>
    <text class="label" x="28" y="42">10 / Vidya Mark</text>
    <g transform="translate(46 82)">
      <rect width="118" height="118" rx="24" fill="#102033"/>
      <path d="M27 38H91" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>
      <path d="M38 38C37 57 43 76 59 91C75 76 81 57 80 38" stroke="#7DD3C7" stroke-width="10" stroke-linecap="round"/>
      <path d="M43 61H75" class="line-blue"/>
      <circle cx="59" cy="27" r="7" fill="#C77A15"/>
    </g>
    <text class="name" x="196" y="139">Technowiz</text>
    <text class="sub" x="198" y="172">Solutions</text>
    <text class="note" x="198" y="213">Vidya/knowledge inspiration; softer and more premium.</text>
