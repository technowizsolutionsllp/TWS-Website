<svg width="1600" height="1800" viewBox="0 0 1600 1800" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Technowiz Solutions main logo variants</title>
  <desc id="desc">Ten prototype main-logo directions for Technowiz Solutions.</desc>
  <rect width="1600" height="1800" fill="#F8FAFC"/>

  <defs>
    <style>
      .panel { fill: #ffffff; stroke: #d9e1ea; }
      .label { fill: #667085; font: 700 18px Arial, Helvetica, sans-serif; letter-spacing: 0; }
      .name { fill: #102033; font: 760 39px Arial, Helvetica, sans-serif; letter-spacing: 0; }
      .sub { fill: #667085; font: 620 20px Arial, Helvetica, sans-serif; letter-spacing: 0; }
      .note { fill: #667085; font: 500 16px Arial, Helvetica, sans-serif; letter-spacing: 0; }
      .ink { fill: #102033; }
      .blue { fill: #2356d9; }
      .teal { fill: #008f7a; }
      .amber { fill: #c77a15; }
      .line { stroke: #102033; stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; }
      .line-teal { stroke: #008f7a; stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; }
      .line-blue { stroke: #2356d9; stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <text x="64" y="72" fill="#102033" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="760">Technowiz Solutions logo exploration</text>
  <text x="64" y="112" fill="#667085" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="520">Modern, simple-language, slightly enterprise directions. These are inspiration-led originals, not copies of existing global brands.</text>

  <g transform="translate(64 160)">
    <rect class="panel" width="700" height="280" rx="18"/>
    <text class="label" x="28" y="42">01 / Precision Window</text>
    <g transform="translate(46 82)">
      <rect width="118" height="118" rx="24" class="ink"/>
      <path d="M28 34H90M59 34V86" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round"/>
      <path d="M32 82L48 54L60 82L76 54L90 82" stroke="#7DD3C7" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text class="name" x="196" y="139">Technowiz</text>
    <text class="sub" x="198" y="172">Solutions</text>
    <text class="note" x="198" y="213">Enterprise-safe monogram. Strong favicon potential.</text>
  </g>

  <g transform="translate(836 160)">
    <rect class="panel" width="700" height="280" rx="18"/>
    <text class="label" x="28" y="42">02 / Connected Nodes</text>
    <g transform="translate(46 82)">
      <rect width="118" height="118" rx="24" fill="#EFF6FF"/>
      <path d="M30 78L58 36L88 78" class="line"/>
      <path d="M42 78H101" class="line-blue"/>
      <circle cx="30" cy="78" r="11" class="teal"/>
      <circle cx="58" cy="36" r="11" class="blue"/>
      <circle cx="88" cy="78" r="11" class="teal"/>
      <circle cx="101" cy="78" r="8" class="amber"/>
    </g>
    <text class="name" x="196" y="139">Technowiz</text>
    <text class="sub" x="198" y="172">Solutions</text>
    <text class="note" x="198" y="213">Networked product company, not a generic IT vendor.</text>
  </g>

  <g transform="translate(64 472)">
    <rect class="panel" width="700" height="280" rx="18"/>
    <text class="label" x="28" y="42">03 / Secure Stack</text>
    <g transform="translate(46 82)">
      <rect width="118" height="118" rx="24" class="ink"/>
      <path d="M32 42L59 27L86 42L59 57L32 42Z" fill="#FFFFFF"/>
      <path d="M32 61L59 46L86 61L59 76L32 61Z" fill="#7DD3C7"/>
      <path d="M32 80L59 65L86 80L59 95L32 80Z" fill="#2356D9"/>
    </g>
    <text class="name" x="196" y="139">Technowiz</text>
    <text class="sub" x="198" y="172">Solutions</text>
    <text class="note" x="198" y="213">Product layers, systems thinking, enterprise calm.</text>
  </g>

  <g transform="translate(836 472)">
    <rect class="panel" width="700" height="280" rx="18"/>
    <text class="label" x="28" y="42">04 / Checkpoint</text>
    <g transform="translate(46 82)">
