    <text class="sub" x="198" y="172">Solutions</text>
    <text class="note" x="198" y="213">Simple, scalable, and closest to global SaaS systems.</text>
  </g>

  <g transform="translate(64 1408)">
    <rect class="panel" width="700" height="280" rx="18"/>
    <text class="label" x="28" y="42">09 / Signal Arrow</text>
    <g transform="translate(46 82)">
      <rect width="118" height="118" rx="24" fill="#102033"/>
      <path d="M29 76H72" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round"/>
      <path d="M66 44L91 59L66 74V44Z" fill="#7DD3C7"/>
      <path d="M35 44H56" class="line-blue"/>
      <path d="M35 92H88" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" opacity="0.65"/>
    </g>
    <text class="name" x="196" y="139">Technowiz</text>
    <text class="sub" x="198" y="172">Solutions</text>
    <text class="note" x="198" y="213">Forward motion, launch energy, product-led feel.</text>
  </g>

  <g transform="translate(836 1408)">
    <rect class="panel" width="700" height="280" rx="18"/>
    <text class="label" x="28" y="42">10 / Wordmark First</text>
    <g transform="translate(46 82)">
      <rect width="118" height="118" rx="24" fill="#FFFFFF" stroke="#D9E1EA"/>
      <path d="M30 36H89" class="line"/>
      <path d="M60 36V88" class="line"/>
      <path d="M32 87L47 60L59 87L75 60L88 87" class="line-teal"/>
    </g>
    <text class="name" x="196" y="139">technowiz</text>
    <text class="sub" x="198" y="172">SOLUTIONS</text>
    <text class="note" x="198" y="213">Lowercase modern wordmark with restrained mark.</text>
  </g>
</svg>
