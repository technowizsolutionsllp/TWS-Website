      <path d="M31 35H87V84H31V35Z" stroke="#102033" stroke-width="9" stroke-linejoin="round"/>
      <path d="M43 58L56 71L80 45" class="line-teal"/>
      <path d="M24 92H95" class="line-blue"/>
    </g>
    <text class="name" x="196" y="139">Technowiz</text>
    <text class="sub" x="198" y="172">Solutions</text>
    <text class="note" x="198" y="213">Review-before-change as the core brand promise.</text>
  </g>

  <g transform="translate(64 784)">
    <rect class="panel" width="700" height="280" rx="18"/>
    <text class="label" x="28" y="42">05 / Horizon Wordmark</text>
    <g transform="translate(46 82)">
      <rect width="118" height="118" rx="24" fill="#102033"/>
      <path d="M25 73C43 47 75 47 93 73" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round"/>
      <path d="M34 75H84" class="line-teal"/>
      <path d="M59 34V87" stroke="#2356D9" stroke-width="10" stroke-linecap="round"/>
    </g>
    <text class="name" x="196" y="139">Technowiz Solutions</text>
    <text class="sub" x="198" y="172">Local-first software</text>
    <text class="note" x="198" y="213">More premium and editorial; better for corporate pages.</text>
  </g>

  <g transform="translate(836 784)">
    <rect class="panel" width="700" height="280" rx="18"/>
    <text class="label" x="28" y="42">06 / Code Bracket</text>
    <g transform="translate(46 82)">
      <rect width="118" height="118" rx="24" fill="#EFF6FF"/>
      <path d="M46 34L28 59L46 84" class="line"/>
      <path d="M72 34L90 59L72 84" class="line"/>
      <path d="M53 86L66 32" stroke="#008F7A" stroke-width="10" stroke-linecap="round"/>
    </g>
    <text class="name" x="196" y="139">Technowiz</text>
    <text class="sub" x="198" y="172">Solutions</text>
    <text class="note" x="198" y="213">Clear software signal; stronger for engineering services.</text>
  </g>

  <g transform="translate(64 1096)">
    <rect class="panel" width="700" height="280" rx="18"/>
    <text class="label" x="28" y="42">07 / Trust Shield</text>
    <g transform="translate(46 82)">
      <rect width="118" height="118" rx="24" fill="#102033"/>
      <path d="M59 23L91 36V61C91 80 78 94 59 101C40 94 27 80 27 61V36L59 23Z" fill="#FFFFFF"/>
      <path d="M43 61L55 73L77 49" stroke="#008F7A" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M59 23V101" stroke="#2356D9" stroke-width="7" stroke-linecap="round" opacity="0.9"/>
    </g>
    <text class="name" x="196" y="139">Technowiz</text>
    <text class="sub" x="198" y="172">Solutions</text>
    <text class="note" x="198" y="213">Most enterprise-trust direction; may feel less unique.</text>
  </g>

  <g transform="translate(836 1096)">
    <rect class="panel" width="700" height="280" rx="18"/>
    <text class="label" x="28" y="42">08 / Modular T</text>
    <g transform="translate(46 82)">
      <rect width="118" height="118" rx="24" fill="#F8FAFC" stroke="#D9E1EA"/>
      <rect x="26" y="28" width="66" height="18" rx="7" class="ink"/>
      <rect x="50" y="45" width="18" height="49" rx="7" class="ink"/>
      <rect x="76" y="55" width="18" height="39" rx="7" class="blue"/>
      <rect x="24" y="70" width="18" height="24" rx="7" class="teal"/>
    </g>
