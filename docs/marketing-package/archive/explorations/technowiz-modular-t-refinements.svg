    <text class="sub" x="198" y="172">Solutions</text>
    <text class="note" x="198" y="213">Most enterprise, less soft, more engineered.</text>
  </g>

  <g transform="translate(836 1096)">
    <rect class="panel" width="700" height="280" rx="18"/>
    <text class="label" x="28" y="42">M8 / Portal T</text>
    <g transform="translate(46 82)">
      <rect width="118" height="118" rx="25" class="ink"/>
      <path d="M27 79C34 44 84 44 91 79" stroke="#7DD3C7" stroke-width="9" stroke-linecap="round"/>
      <rect x="25" y="30" width="68" height="18" rx="7" fill="#fff"/>
      <rect x="50" y="48" width="18" height="48" rx="7" fill="#fff"/>
      <rect x="76" y="60" width="18" height="36" rx="7" fill="#2356D9"/>
      <circle cx="59" cy="22" r="5" fill="#C77A15"/>
    </g>
    <text class="name" x="196" y="139">Technowiz</text>
    <text class="sub" x="198" y="172">Solutions</text>
    <text class="note" x="198" y="213">Magic/portal cue in the background, still compact.</text>
  </g>

  <g transform="translate(64 1408)">
    <rect class="panel" width="700" height="280" rx="18"/>
    <text class="label" x="28" y="42">M9 / Wordmark Icon</text>
    <g transform="translate(46 82)">
      <rect width="118" height="118" rx="25" fill="#fff" stroke="#d9e1ea"/>
      <path d="M26 31H94" class="line"/>
      <path d="M51 31V92" class="line"/>
      <path d="M75 51V92" class="blue-line"/>
      <path d="M25 72V92" class="teal-line"/>
      <circle cx="94" cy="31" r="5" class="gold"/>
    </g>
    <text x="196" y="139" fill="#102033" font-family="Arial, Helvetica, sans-serif" font-size="39" font-weight="720">TechnoWiz</text>
    <text class="sub" x="198" y="172">Solutions</text>
    <text class="note" x="198" y="213">Best if the brand casing carries the “Wiz” idea.</text>
  </g>

  <g transform="translate(836 1408)">
    <rect class="panel" width="700" height="280" rx="18"/>
    <text class="label" x="28" y="42">M10 / Monolith T</text>
    <g transform="translate(46 82)">
      <rect width="118" height="118" rx="25" fill="#102033"/>
      <rect x="24" y="29" width="70" height="18" rx="4" fill="#fff"/>
      <rect x="50" y="47" width="18" height="50" rx="4" fill="#fff"/>
      <rect x="76" y="56" width="18" height="41" rx="4" fill="#7DD3C7"/>
      <rect x="24" y="75" width="18" height="22" rx="4" fill="#2356D9"/>
      <path d="M26 105H94" stroke="#C77A15" stroke-width="5" stroke-linecap="round"/>
    </g>
    <text class="name" x="196" y="139">Technowiz</text>
    <text class="sub" x="198" y="172">Solutions</text>
    <text class="note" x="198" y="213">Boldest corporate mark; highly scalable.</text>
  </g>
</svg>
