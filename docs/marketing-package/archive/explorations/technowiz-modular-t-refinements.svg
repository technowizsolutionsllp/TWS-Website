    <text class="sub" x="198" y="172">Solutions</text>
    <text class="note" x="198" y="213">More product-family/module metaphor.</text>
  </g>

  <g transform="translate(836 472)">
    <rect class="panel" width="700" height="280" rx="18"/>
    <text class="label" x="28" y="42">M4 / Circuit T</text>
    <g transform="translate(46 82)">
      <rect width="118" height="118" rx="25" fill="#fff" stroke="#d9e1ea"/>
      <rect x="25" y="30" width="68" height="18" rx="7" class="ink"/>
      <rect x="50" y="48" width="18" height="48" rx="7" class="ink"/>
      <path d="M68 58H94M42 78H24M94 58V78" class="blue-line"/>
      <circle cx="94" cy="58" r="5" class="blue"/>
      <circle cx="24" cy="78" r="5" class="teal"/>
      <circle cx="94" cy="78" r="5" class="gold"/>
    </g>
    <text class="name" x="196" y="139">Technowiz</text>
    <text class="sub" x="198" y="172">Solutions</text>
    <text class="note" x="198" y="213">Clearer technology cue through circuit endpoints.</text>
  </g>

  <g transform="translate(64 784)">
    <rect class="panel" width="700" height="280" rx="18"/>
    <text class="label" x="28" y="42">M5 / Wand T</text>
    <g transform="translate(46 82)">
      <rect width="118" height="118" rx="25" class="ink"/>
      <rect x="26" y="31" width="63" height="17" rx="7" fill="#fff"/>
      <rect x="50" y="48" width="18" height="47" rx="7" fill="#fff"/>
      <rect x="74" y="56" width="18" height="39" rx="7" fill="#7DD3C7"/>
      <path d="M82 30L100 16" stroke="#C77A15" stroke-width="7" stroke-linecap="round"/>
      <circle cx="101" cy="16" r="5" fill="#C77A15"/>
      <path d="M104 5V9M109 20H113M96 10L92 6" stroke="#C77A15" stroke-width="4" stroke-linecap="round"/>
    </g>
    <text class="name" x="196" y="139">Technowiz</text>
    <text class="sub" x="198" y="172">Solutions</text>
    <text class="note" x="198" y="213">Adds the wizardry idea while staying modern.</text>
  </g>

  <g transform="translate(836 784)">
    <rect class="panel" width="700" height="280" rx="18"/>
    <text class="label" x="28" y="42">M6 / Shiro Modular</text>
    <g transform="translate(46 82)">
      <rect width="118" height="118" rx="25" fill="#F0FBF8"/>
      <path d="M25 31H94" class="line"/>
      <rect x="50" y="45" width="18" height="48" rx="7" class="ink"/>
      <rect x="76" y="55" width="18" height="38" rx="7" class="blue"/>
      <path d="M24 82C36 69 49 69 58 84" class="teal-line"/>
      <circle cx="96" cy="31" r="5" class="gold"/>
    </g>
    <text class="name" x="196" y="139">Technowiz</text>
    <text class="sub" x="198" y="172">Solutions</text>
    <text class="note" x="198" y="213">Subtle Sanskrit headline cue added to Modular T.</text>
  </g>

  <g transform="translate(64 1096)">
    <rect class="panel" width="700" height="280" rx="18"/>
    <text class="label" x="28" y="42">M7 / Precision Blocks</text>
    <g transform="translate(46 82)">
      <rect width="118" height="118" rx="25" fill="#fff" stroke="#d9e1ea"/>
      <rect x="25" y="28" width="68" height="19" rx="4" class="ink"/>
      <rect x="50" y="47" width="19" height="50" rx="4" class="ink"/>
      <rect x="77" y="55" width="19" height="42" rx="4" class="blue"/>
      <rect x="23" y="72" width="19" height="25" rx="4" class="teal"/>
      <path d="M25 105H96" stroke="#C77A15" stroke-width="5" stroke-linecap="round"/>
    </g>
