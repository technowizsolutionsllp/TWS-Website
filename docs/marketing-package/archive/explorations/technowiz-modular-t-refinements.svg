<svg width="1600" height="1800" viewBox="0 0 1600 1800" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Technowiz Modular T logo refinements</title>
  <desc id="desc">Ten refinements based on the Modular T logo direction.</desc>
  <rect width="1600" height="1800" fill="#F8FAFC"/>
  <defs>
    <style>
      .panel { fill: #fff; stroke: #d9e1ea; }
      .label { fill: #667085; font: 700 18px Arial, Helvetica, sans-serif; letter-spacing: 0; }
      .name { fill: #102033; font: 760 39px Arial, Helvetica, sans-serif; letter-spacing: 0; }
      .sub { fill: #667085; font: 620 20px Arial, Helvetica, sans-serif; letter-spacing: 0; }
      .note { fill: #667085; font: 500 16px Arial, Helvetica, sans-serif; letter-spacing: 0; }
      .ink { fill: #102033; }
      .blue { fill: #2356d9; }
      .teal { fill: #008f7a; }
      .gold { fill: #c77a15; }
      .line { stroke: #102033; stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; }
      .thin { stroke: #102033; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .blue-line { stroke: #2356d9; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
      .teal-line { stroke: #008f7a; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
      .gold-line { stroke: #c77a15; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
      .white-line { stroke: #fff; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <text x="64" y="72" fill="#102033" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="760">Modular T refinements</text>
  <text x="64" y="112" fill="#667085" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="520">Based on the first sheet's Modular T: global-tech simplicity, modular construction, and subtle Technowiz/wizardry cues.</text>

  <g transform="translate(64 160)">
    <rect class="panel" width="700" height="280" rx="18"/>
    <text class="label" x="28" y="42">M1 / Original Refined</text>
    <g transform="translate(46 82)">
      <rect width="118" height="118" rx="25" fill="#fff" stroke="#d9e1ea"/>
      <rect x="26" y="29" width="66" height="18" rx="7" class="ink"/>
      <rect x="50" y="45" width="18" height="49" rx="7" class="ink"/>
      <rect x="76" y="55" width="18" height="39" rx="7" class="blue"/>
      <rect x="24" y="70" width="18" height="24" rx="7" class="teal"/>
      <circle cx="96" cy="29" r="5" class="gold"/>
    </g>
    <text class="name" x="196" y="139">Technowiz</text>
    <text class="sub" x="198" y="172">Solutions</text>
    <text class="note" x="198" y="213">Closest to the first-sheet variant, cleaned up.</text>
  </g>

  <g transform="translate(836 160)">
    <rect class="panel" width="700" height="280" rx="18"/>
    <text class="label" x="28" y="42">M2 / Dark Modular</text>
    <g transform="translate(46 82)">
      <rect width="118" height="118" rx="25" class="ink"/>
      <rect x="26" y="29" width="66" height="18" rx="7" fill="#fff"/>
      <rect x="50" y="45" width="18" height="49" rx="7" fill="#fff"/>
      <rect x="76" y="55" width="18" height="39" rx="7" fill="#7DD3C7"/>
      <rect x="24" y="70" width="18" height="24" rx="7" fill="#2356D9"/>
      <circle cx="96" cy="29" r="5" fill="#C77A15"/>
    </g>
    <text class="name" x="196" y="139">Technowiz</text>
    <text class="sub" x="198" y="172">Solutions</text>
    <text class="note" x="198" y="213">Strongest app/icon version of the Modular T family.</text>
  </g>

  <g transform="translate(64 472)">
    <rect class="panel" width="700" height="280" rx="18"/>
    <text class="label" x="28" y="42">M3 / Stacked Systems</text>
    <g transform="translate(46 82)">
      <rect width="118" height="118" rx="25" fill="#EFF6FF"/>
      <rect x="26" y="30" width="66" height="17" rx="7" class="ink"/>
      <rect x="50" y="47" width="18" height="48" rx="7" class="ink"/>
      <rect x="75" y="47" width="19" height="17" rx="7" class="blue"/>
      <rect x="75" y="70" width="19" height="25" rx="7" class="teal"/>
      <rect x="25" y="72" width="18" height="23" rx="7" class="gold"/>
